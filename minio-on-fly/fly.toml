# fly.toml app configuration file generated for minio-backend on 2025-07-18T23:33:31+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'minio-backend'
primary_region = 'cdg'

[env]
MINIO_ROOT_USER = "minioadmin"
MINIO_ROOT_PASSWORD = "minioadmin"

[[mounts]]
source = "minio_data"
destination = "/data"

[http_service]
internal_port = 9000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[services]]
protocol = "tcp"
internal_port = 9000
ports = [{ handlers = ["http"], port = 80 }, { handlers = ["tls", "http"], port = 443 }]

[[services]]
protocol = "tcp"
internal_port = 9001
ports = [{ handlers = ["tls", "http"], port = 9001 }]

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
