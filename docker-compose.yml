version: '3.8'

services:
  # Base de données PostgreSQL
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: portfolio-db
  #   environment:
  #     POSTGRES_DB: portfolio
  #     POSTGRES_USER: portfolio_user
  #     POSTGRES_PASSWORD: portfolio_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   networks:
  #     - portfolio-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis pour le cache (optionnel)
  # redis:
  #   image: redis:7-alpine
  #   container_name: portfolio-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - portfolio-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Backend API
  backend:
    build:
      context: ./my-portfolio-backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: portfolio_user
      DATABASE_PASSWORD: portfolio_password
      DATABASE_NAME: portfolio
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./my-portfolio-backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio-network
    command: npm run start:dev

  # Frontend
  frontend:
    build:
      context: ./my-portfolio-frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./my-portfolio-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - portfolio-network
    command: npm run dev

  # Nginx reverse proxy (optionnel pour la production)
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  portfolio-network:
    driver: bridge
